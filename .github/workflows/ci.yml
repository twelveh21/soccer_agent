name: Soccer Agent CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 默认只给工作流读取仓库代码的权限，避免测试流程拥有多余的写权限。
permissions:
  contents: read

jobs:
  test:
    name: Python tests and static checks
    runs-on: ubuntu-latest
    steps:
      # 拉取当前提交，确保 CI 验证的就是 PR 或 push 的版本。
      - name: Check out source
        uses: actions/checkout@v4

      # 与 Dockerfile 保持一致，统一使用 Python 3.13。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            agent_base/requirements.txt
            requirements-dev.txt

      # 运行依赖与测试依赖分开安装，便于生产镜像保持精简。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent_base/requirements.txt -r requirements-dev.txt

      # 先编译所有 Python 文件，快速发现语法或导入级别的基础问题。
      - name: Compile Python modules
        run: python -m compileall -q agent_base infrastructure knowledge_base memory multimodal service tool worker

      # 单元测试不依赖真实模型 Key；涉及模型/联网的集成验证保留给本地或独立环境。
      - name: Run unit tests
        run: python -m pytest -q tests

  docker:
    name: Docker configuration and image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 只校验配置和构建镜像，不启动会调用真实模型 API 的业务服务。
      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build soccer-agent celery-worker
