services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soccer_agent
      POSTGRES_USER: soccer_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soccer_agent_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - soccer_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soccer_agent -d soccer_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - soccer_agent_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  soccer-agent:
    build: .
    # CI 没有真实 .env 也能校验 Compose / 构建镜像；本地存在 .env 时自动读取。
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://soccer_agent:${POSTGRES_PASSWORD:-soccer_agent_dev_password}@postgres:5432/soccer_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - soccer_agent_data:/app/data
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn service.app:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  celery-worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://soccer_agent:${POSTGRES_PASSWORD:-soccer_agent_dev_password}@postgres:5432/soccer_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=solo"]
    volumes:
      # API 与 Worker 共用命名卷；API 保存的上传文件，Worker 才能读取到。
      - soccer_agent_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  soccer_agent_data:
  soccer_agent_postgres:
  soccer_agent_redis:
